name: Compilar app Android (VetFlowCare)
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Sincronizar o app com o projeto Android
        run: npx cap sync android
      - name: APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VetFlowCare-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar chave de assinatura
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vfc.keystore"
          echo "VFC_KEYSTORE_FILE=$RUNNER_TEMP/vfc.keystore" >> $GITHUB_ENV
          echo "VFC_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "VFC_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "VFC_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "VFC_VERSION_CODE=${{ github.run_number }}${{ secrets.VERSION_CODE_BASE || '1000' }}" >> $GITHUB_ENV
      - name: AAB e APK assinados
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: VetFlowCare-Play-Store-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
